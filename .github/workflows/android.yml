name: Build Android apps

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build both apps
        working-directory: android
        timeout-minutes: 20
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee ../build.log

      - name: Save build log for debugging
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ 2>/dev/null || echo "no gradle log (failed before build)" > /tmp/logs/build.log
          echo "run ${{ github.run_number }} at $(date -u)" >> /tmp/logs/build.log
          git checkout --orphan build-logs
          git rm -rfq . && cp /tmp/logs/build.log . && git add build.log
          git commit -qm "Build log for run ${{ github.run_number }}" && git push -f origin build-logs

      - name: Collect APKs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/jp/release/app-jp-release.apk out/nihongo.apk
          cp android/app/build/outputs/apk/es/release/app-es-release.apk out/espanol.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android apps (build ${{ github.run_number }})
          body: Install nihongo.apk (日本語) and/or espanol.apk (Español) on your Android phone.
          files: out/*.apk
          make_latest: true
