name: Build Android apps

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check the code compiles
        working-directory: android
        run: |
          set -o pipefail
          gradle compileJpReleaseJavaWithJavac compileEsReleaseJavaWithJavac --no-daemon --console=plain 2>&1 | tee ../build.log

      - name: Signing key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Add the ANDROID_KEY_PASSWORD secret (repo Settings → Secrets and variables → Actions)"; echo "MISSING ANDROID_KEY_PASSWORD SECRET (code compiled OK)" >> build.log; exit 1; fi
          if [ ! -f android/signing.p12 ]; then
            # first run: make a new key, protected by the secret password, and keep it in the repo
            keytool -genkeypair -noprompt -keystore android/signing.p12 -storetype PKCS12 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -alias flashcards -keyalg RSA -keysize 3072 \
              -validity 20000 -dname "CN=rosybence flashcards"
            git config user.name "build-bot"
            git config user.email "build-bot@users.noreply.github.com"
            git add android/signing.p12
            git commit -qm "Add password-protected signing key"
            git push origin HEAD:main
          fi

      - name: Build both apps
        env:
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        timeout-minutes: 20
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee ../build.log

      - name: Save build log for debugging
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ 2>/dev/null || echo "no gradle log (failed before build)" > /tmp/logs/build.log
          echo "run ${{ github.run_number }} at $(date -u)" >> /tmp/logs/build.log
          git checkout --orphan build-logs
          git rm -rfq . && cp /tmp/logs/build.log . && git add build.log
          git commit -qm "Build log for run ${{ github.run_number }}" && git push -f origin build-logs

      - name: Collect APKs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/jp/release/app-jp-release.apk out/nihongo.apk
          cp android/app/build/outputs/apk/es/release/app-es-release.apk out/espanol.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android apps (build ${{ github.run_number }})
          body: Install nihongo.apk (日本語) and/or espanol.apk (Español) on your Android phone.
          files: out/*.apk
          make_latest: true
