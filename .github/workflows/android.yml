name: Build Android apps

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build both apps
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/jp/release/app-jp-release.apk out/nihongo.apk
          cp android/app/build/outputs/apk/es/release/app-es-release.apk out/espanol.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android apps (build ${{ github.run_number }})
          body: Install nihongo.apk (日本語) and/or espanol.apk (Español) on your Android phone.
          files: out/*.apk
          make_latest: true
