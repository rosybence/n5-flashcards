<body>
<title>N5 Speaking Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone study app — header, direction switch, the card, controls pinned under it. Indigo ink on cool washi paper. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#152036; --muted:#5B6679; --line:#D5DBE5;
  --accent:#28418F; --accent-soft:#E2E8F7; --good:#23775A; --good-soft:#DDF0E7; --bad:#B0402C; --bad-soft:#F7E1DC; --hard:#9A6A12; --casual:#8A5300; --casual-soft:#FBEBCB;
  --jp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#172034; --ink:#E6EAF2; --muted:#9AA4B7; --line:#2A3550;
  --accent:#93A9F2; --accent-soft:#222E4D; --good:#5CC79C; --good-soft:#163328; --bad:#EB8A76; --bad-soft:#3A1E1A; --hard:#E2B357; --casual:#EDBB62; --casual-soft:#3B2C12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#172034; --ink:#E6EAF2; --muted:#9AA4B7; --line:#2A3550;
  --accent:#93A9F2; --accent-soft:#222E4D; --good:#5CC79C; --good-soft:#163328; --bad:#EB8A76; --bad-soft:#3A1E1A; --hard:#E2B357; --casual:#EDBB62; --casual-soft:#3B2C12; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--jp);font-size:22px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.counts{display:flex;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill{padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill strong{color:var(--ink);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
.decks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.decks button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--muted)}
.decks b{font-family:var(--jp);font-size:18px;font-weight:700;color:var(--ink);line-height:1.2}
.decks button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.decks button[aria-pressed="true"] b{color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 6px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:300px;position:relative}
.tag{position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag.new{color:var(--accent)}
.front{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-width:0;padding-top:18px}
.jp{font-family:var(--jp);font-weight:700;font-size:clamp(40px,13vw,64px);line-height:1.15;overflow-wrap:anywhere}
.jp.long{font-size:clamp(24px,7vw,34px)}
.stack{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.stack .rt{font-family:var(--ui);font-weight:500;font-size:.42em;color:var(--accent);letter-spacing:.02em}
.jp rt{font-family:var(--ui);font-weight:500;font-size:.3em;color:var(--accent);letter-spacing:.03em;padding-bottom:4px}
.en-front{font-size:clamp(26px,8vw,36px);font-weight:500;text-wrap:balance}
.answer{width:100%;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.answer .pic{font-size:64px;line-height:1.1;margin-bottom:4px;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.answer .jp{font-size:34px}
.answer .kana{color:var(--muted);font-family:var(--jp);font-size:16px}
.answer .en{font-size:20px;font-weight:600;text-wrap:balance}
.fixarea{display:flex;flex-direction:column;align-items:center}
#fbBar{align-self:center}
.fix-btn{margin-top:4px;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}
.fix{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border-radius:12px;background:var(--bg);text-align:left}
.fix-kinds{display:flex;flex-wrap:wrap;gap:6px}
.fix-kinds button{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.fix-kinds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.fix-label{font-size:13px;color:var(--muted)}
.fix input{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.fix-note{margin:0;font-size:12.5px;color:var(--muted)}
.fix .btn{text-decoration:none;font-size:14px;padding:11px 8px}
.alts-btn{margin-top:8px;font-size:13.5px;font-weight:500;color:var(--accent);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.alts{display:flex;flex-direction:column;gap:8px;margin-top:6px;width:100%}
.alts .grp{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.alts .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.chip{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.chip.casual{background:var(--casual-soft);color:var(--casual);display:inline-flex;align-items:center;gap:6px}
.chip small{font-family:var(--ui);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:4px;border:1px solid currentColor}
.cw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.rd{font-family:var(--ui);font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.02em}
.chip.casual .rd{color:var(--casual)}
.chip.jlpt{background:var(--accent);color:var(--surface);font-weight:500}
.chip.jl{background:var(--accent);color:var(--surface)}
.chip.jl .rd{color:var(--surface);opacity:.85}
.chip.jl small{display:inline-block;margin-left:6px}
.jbadge{font-family:var(--ui);font-size:10.5px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--accent);color:var(--surface);vertical-align:2px}
.chip.jpc{font-family:var(--jp);font-size:16px}
.feedback{font-size:14px;padding:7px 12px;border-radius:10px;text-align:center;max-width:100%;overflow-wrap:anywhere}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.listening{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}
.grades small{font-weight:400;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.grades button[data-g="0"]{color:var(--bad)} .grades button[data-g="1"]{color:var(--hard)}
.grades button[data-g="2"]{color:var(--good)} .grades button[data-g="3"]{color:var(--accent)}
.grades button.suggest{outline:2px solid currentColor;outline-offset:-2px}
.after{display:flex;flex-direction:column;gap:10px}
.after .row .btn{padding:16px 10px}
.next{flex:1.4;font-size:17px;font-weight:600}
#flip.wrong{color:var(--bad);border-color:var(--bad)}
#flip.right{color:var(--good);border-color:var(--good)}
.mark{text-align:center;font-size:13px;color:var(--muted)}
.mark b{font-weight:600}.mark .ok{color:var(--good)}.mark .no{color:var(--bad)}
.more summary{font-size:13px;color:var(--muted);cursor:pointer;text-align:center;list-style:none;padding:4px}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{margin-bottom:8px}
.walk{border-radius:16px;padding:14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px}
.walk p{margin:0;font-size:13.5px;color:var(--muted)}
.walk .status{font-size:17px;font-weight:600;color:var(--ink);min-height:1.45em}
.grace{display:flex;gap:8px}
.grace .btn{padding:14px 6px;font-size:14px}
.whelp{font-size:13.5px;color:var(--muted)}
.whelp ol{margin:0;padding-left:20px;display:grid;gap:4px}
.whelp p{margin:8px 0 0}
.whelp b{color:var(--ink);font-weight:600}
.walkseg{background:var(--surface)}
.notice{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.notice strong{color:var(--ink)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.settings select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.danger{color:var(--bad);font-weight:500;justify-self:start;padding:4px 0}
.done{text-align:center;color:var(--muted)}
.done b{display:block;font-family:var(--jp);font-size:30px;color:var(--ink);margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.btn.listening svg{animation:pulse 1s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(1.25)}}
</style>

<div class="app">
  <header>
    <div class="brand"><b>日本語</b><span id="brandSub">JLPT N5</span></div>
    <div class="counts"><span class="pill"><strong id="cDue">0</strong> due</span><span class="pill"><strong id="cNew">0</strong> new</span></div>
    <button class="iconbtn" id="setBtn" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>

  <div class="settings" id="settings" hidden>
    <label>Reading above kanji <select id="sRuby"><option value="romaji">Romaji</option><option value="kana">Hiragana</option><option value="none">None</option></select></label>
    <label>N5 cards <select id="sTypes"><option value="both">Words and phrases</option><option value="words">Words only</option><option value="phrases">Phrases only</option></select></label>
    <label>New cards per day <select id="sNew"><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option></select></label>
    <label>Time to answer (walk mode) <select id="sGap"><option value="4">4 s</option><option value="6">6 s</option><option value="8">8 s</option><option value="10">10 s</option></select></label>
    <label>Japanese voice speed <select id="sRate"><option value="0.7">Slow</option><option value="0.85">Relaxed</option><option value="1">Natural</option></select></label>
    <label>Play audio when a card appears <select id="sAuto"><option value="1">On</option><option value="0">Off</option></select></label>
    <button class="danger" id="reset">Reset all progress</button>
  </div>

  <div class="decks" role="group" aria-label="Decks">
    <button data-deck="hira" aria-pressed="false"><b>あ</b>Hiragana</button>
    <button data-deck="kata" aria-pressed="false"><b>ア</b>Katakana</button>
    <button data-deck="n5" aria-pressed="true"><b>N5</b>Words</button>
    <button data-deck="n4" aria-pressed="false"><b>N4</b>Words</button>
  </div>
  <div class="seg" role="group" aria-label="Direction">
    <button id="dJE" aria-pressed="true">日本語 → English</button>
    <button id="dEJ" aria-pressed="false">English → 日本語</button>
  </div>

  <div class="card" id="card"></div>
  <div class="feedback" id="fbBar" hidden></div>

  <div class="row" id="actions">
    <button class="btn" id="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>Play</button>
    <button class="btn" id="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Speak</button>
    <button class="btn primary" id="reveal">Show answer</button>
  </div>
  <div class="after" id="after" hidden>
    <div class="row">
      <button class="btn" id="flip"></button>
      <button class="btn primary next" id="next">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="mark" id="mark"></div>
    <details class="more"><summary>Rate it yourself</summary><div class="grades" id="grades"></div></details>
    <div id="fixArea" class="fixarea"></div>
  </div>

  <div class="walk">
    <div class="status" id="wStatus">Walk mode</div>
    <div class="seg walkseg" id="walkModes" role="group" aria-label="Walk mode type">
      <button id="wmSpeak" aria-pressed="true">Speak answers</button>
      <button id="wmListen" aria-pressed="false">Listen only</button>
    </div>
    <div id="wHelp" class="whelp"></div>
    <div class="grace" id="grace" hidden></div>
    <button class="btn primary" id="walkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1.6"/><path d="M10 21l2-6-2.5-2.5L11 8l4 3 3 1M9.5 12.5L7 14M12 15l3 2 1 4"/></svg><span>Start walk mode</span></button>
  </div>

  <div class="notice" id="micNote" hidden></div>
</div>

function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,j)=>j);

const NUM={one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'};
function normEn(s){s=s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/^(to|the|a|an|my|it's|its|it is)\s+/,'');return s.split(' ').map(w=>NUM[w]||w).join(' ')}
function normJa(s){return s.replace(/下さい/g,'ください').replace(/頂きます/g,'いただきます').replace(/有難う/g,'ありがとう').replace(/御願い/g,'お願い').replace(/分か/g,'わか').replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/[\s。、，．！？!?.,「」]/g,'')}

  const n=S.set.dir==='je'?normEn:normJa;const cas=[...c.casual].map(n);
  return heard.some(h=>{h=n(h);return cas.includes(h)})&&!heard.some(h=>{h=n(h);return h===n(c.k)||h===n(c.kana)||c.en.split(';').some(e=>normEn(e)===h)});
}
function judge(c,heard){

  if(c.type==='k'){const T=[c.k,...c.alts].map(normJa),R=normEn(c.r.replace(/\(.*?\)/g,''));return heard.some(h=>T.includes(normJa(h))||normEn(h)===R)}

    const T=[...c.en.split(';'),c.en,...c.alts,...c.jl].map(normEn).filter(Boolean);
    return heard.some(h=>{h=normEn(h);return T.some(t=>h===t||(' '+h+' ').includes(' '+t+' ')||sim(h,t)>=.8||overlap(h,t)>=.75)});
  }

}

  const dir=S.set.dir==='je'?'Japanese → English':'English → Japanese';
  const title=`${cur.k} (${cur.en}): ${KINDS[fixKind].toLowerCase()}${fixText?' — '+fixText.slice(0,60):''}`;
  const body=[`Card: ${cur.k} · ${cur.kana} · ${cur.r}`,`English: ${cur.en}`,`Mode: ${dir}`,lastHeard?`App heard: ${lastHeard}`:'',`Type: ${KINDS[fixKind]}`,'',`Suggestion: ${fixText||'(none)'}`].filter((x,i)=>x||i===5).join('\n');
  return REPO+'?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body)+'&labels=feedback';
}
function fixHtml(){
  if(!showFix)return `<button class="fix-btn" id="fixBtn">Suggest a fix</button>`;
  return `<div class="fix"><div class="fix-kinds" role="group" aria-label="What's the problem">${Object.entries(KINDS).map(([k,v])=>`<button data-kind="${k}" aria-pressed="${fixKind===k}">${v}</button>`).join('')}</div>
  <label class="fix-label" for="fixText">${fixKind==='missing'?'What answer should count?':fixKind==='wrong'?'What should it say instead?':'What’s the problem?'}</label>
  <input id="fixText" type="text" autocomplete="off" value="${escH(fixText).replace(/"/g,'&quot;')}" placeholder="${fixKind==='missing'?'e.g. どうも or thanks':'Type your suggestion'}">
  ${lastHeard?`<p class="fix-note">Includes what the app heard: “${escH(lastHeard)}”</p>`:''}
  <div class="row"><button class="btn" id="fixCancel">Cancel</button><a class="btn primary" id="fixSend" href="${fixUrl()}" target="_blank" rel="noopener">Send on GitHub</a></div></div>`;
}
const escH=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function rdOf(x){const r=READ[x];if(!r)return '';const m=S.set.ruby;const t=m==='romaji'?r[1]:m==='kana'?r[0]:'';return t?`<span class="rd">${escH(t)}</span>`:''}
function altsHtml(){
  // hide kana-only spellings of something already shown (e.g. おねがい when お願い is listed)
  const kanaOf=new Set([cur.kana,...cur.alts.map(x=>READ[x]&&READ[x][0]).filter(Boolean)]);
  const shown=new Set(cur.en.split(';').map(normEn));
  const jl=cur.jl.filter(x=>!shown.has(normEn(x)));const jlN=new Set([...cur.jl.map(normEn)]);
  const a=cur.alts.filter(x=>!(READ[x]&&!READ[x][0]&&kanaOf.has(x))&&!jlN.has(normEn(x))||/[^\x00-\x7F]/.test(x)&&!(READ[x]&&!READ[x][0]&&kanaOf.has(x)));
  // only show alternatives in the language you answer in
  const showJa=S.set.dir==='ej'||cur.type==='k';
  const nJa=a.filter(x=>/[^\x00-\x7F]/.test(x)).length;
  const total=showJa?nJa:a.length-nJa+jl.length;if(!total)return '';
  if(!showAlts)return `<button class="alts-btn" id="altsBtn" aria-expanded="false">Other answers · ${total}</button>`;
  const ja=a.filter(x=>/[^\x00-\x7F]/.test(x)),en=a.filter(x=>!/[^\x00-\x7F]/.test(x)).map(x=>x.replace(/\bi\b/g,'I'));
    const grp=(l,xs,cls)=>xs.length?`<div class="grp"><span class="lbl">${l}</span>${xs.map(x=>{const c=cls!=='jlpt'&&(cur.casual.has(x)||cur.casual.has(x.replace(/\bI\b/g,'i')));const r=cls.includes('jpc')?rdOf(x):'';const j=cls.includes('jl')&&JW[x];return `<span class="chip ${cls}${c?' casual':''}"><span class="cw">${r}<span>${escH(x)}</span></span>${j?`<small>JLPT ${JW[x]}</small>`:''}${c?'<small>casual</small>':''}</span>`}).join('')}</div>`:'';
  return `<button class="alts-btn" id="altsBtn" aria-expanded="true">Hide other answers</button><div class="alts">${showJa?grp('JLPT list · preferred',ja.filter(x=>JW[x]),'jpc jl')+grp(ja.some(x=>JW[x])?'Other Japanese':'Japanese',ja.filter(x=>!JW[x]),'jpc'):grp('JLPT list · preferred',jl,'jlpt')+grp(jl.length?'Other English':'English',en,'')}</div>`;
}
function ruby(c){
  if(c.type==='k')return escH(c.k);
  const mode=S.set.ruby;const rt=mode==='romaji'?c.r:mode==='kana'&&c.k!==c.kana?c.kana:'';
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return rt?(c.k.length>6?`<span class="stack"><span class="rt">${esc(rt)}</span><span>${esc(c.k)}</span></span>`:`<ruby>${esc(c.k)}<rt>${esc(rt)}</rt></ruby>`):esc(c.k);
}
function render(){
  const k=counts();$('cDue').textContent=k.due;$('cNew').textContent=k.fresh;
  document.querySelectorAll('[data-deck]').forEach(b=>b.setAttribute('aria-pressed',S.set.decks.includes(b.dataset.deck)));
  $('brandSub').textContent=['hira','kata','n5','n4'].filter(d=>S.set.decks.includes(d)).map(d=>({hira:'あ',kata:'ア',n5:'N5',n4:'N4'})[d]).join(' · ');
  $('dJE').setAttribute('aria-pressed',S.set.dir==='je');$('dEJ').setAttribute('aria-pressed',S.set.dir==='ej');
  const card=$('card');
  if(!cur){card.innerHTML=`<div class="front"><div class="done"><b>お疲れさま</b>You're done for now. Come back later for reviews, or raise new cards per day in settings.</div></div>`;
    $('actions').hidden=true;$('grades').hidden=true;return}
  $('actions').hidden=false;
  const isNew=!st(cur);const long=cur.k.length>5;
  const front=S.set.dir==='je'?`<div class="jp${long?' long':''}">${ruby(cur)}</div>`:`<div class="en-front">${cur.en}</div>`;
  let html=`<span class="tag${isNew?' new':''}">${isNew?'New card':'Review'}${cur.type==='p'?' · Phrase':''} · ${cur.type==='k'?DECKS[cur.deck]:(JW[cur.k]||JW[cur.kana])?'JLPT '+(JW[cur.k]||JW[cur.kana]):'Extra'}</span><div class="front">${front}</div>`;
  if(revealed){
    html+=`<div class="answer">${cur.pic?`<div class="pic" aria-hidden="true">${cur.pic}</div>`:''}${S.set.dir==='je'?`<div class="en">${cur.en}</div>`:
      `<div class="jp">${ruby(cur)}</div>${cur.type==='k'&&S.set.ruby==='romaji'?`<div class="kana">${cur.r}</div>`:''}`}${altsHtml()}</div>`;
  }
  card.innerHTML=html;
  const fb=$('fbBar');fb.hidden=!feedback;if(feedback){fb.className='feedback '+feedback.cls;fb.textContent=feedback.text}
  $('fixArea').innerHTML=revealed?fixHtml():'';
  $('actions').hidden=revealed;
  $('mic').disabled=micBlocked;
  $('after').hidden=!revealed||walking;
  if(revealed){const now=Date.now(),s=st(cur);
    const wrong=suggest===0;
    const f=$('flip');f.className='btn '+(wrong?'right':'wrong');f.textContent=wrong?'✓ I was right':'✗ I got it wrong';
    $('mark').innerHTML=wrong?`Marked <b class="no">wrong</b> · back in ${fmt(schedule(s,0,now).due-now)}`:`Marked <b class="ok">right</b> · next in ${fmt(schedule(s,2,now).due-now)}`;
    $('grades').innerHTML=['Again','Hard','Good','Easy'].map((n,i)=>`<button data-g="${i}">${n}<small>${fmt(schedule(s,i,now).due-now)}</small></button>`).join('')}
}
function show(){cur=nextCard();revealed=false;feedback=null;suggest=null;showAlts=false;showFix=false;fixText='';lastHeard='';render();
  const pr=cur&&promptOf(cur);if(pr&&+S.set.auto&&!walking&&userActed)speak(pr[0],pr[1])}
function doReveal(){revealed=true;render();const [t,l]=answerOf(cur);return speak(t,l)}
function answerGrade(g){if(!cur)return;grade(cur,g);lastId=cur.id;show()}

/* ---------- manual controls ---------- */
let userActed=false;
document.addEventListener('pointerdown',()=>{userActed=true},{once:true,capture:true});
const cardClick=e=>{
  if(e.target.closest('#altsBtn')){showAlts=!showAlts;render()}
  else if(e.target.closest('#fixBtn')){showFix=true;render();setTimeout(()=>{const i=$('fixText');i&&i.focus()},50)}
  else if(e.target.closest('#fixCancel')){showFix=false;fixText='';render()}
  else if(e.target.closest('[data-kind]')){fixKind=e.target.closest('[data-kind]').dataset.kind;render()}
  else if(e.target.closest('#fixSend')){setTimeout(()=>{showFix=false;fixText='';feedback={cls:'info',text:'Thanks — suggestion opened on GitHub. Tap Submit there to send it.'};render()},400)}
};
const fixInput=e=>{if(e.target.id==='fixText'){fixText=e.target.value;const a=$('fixSend');if(a)a.href=fixUrl()}};
['card','fixArea'].forEach(id=>{$(id).addEventListener('click',cardClick);$(id).addEventListener('input',fixInput)});
$('play').onclick=()=>{if(!cur)return;const x=revealed?answerOf(cur):promptOf(cur);if(x)speak(x[0],x[1])};
$('reveal').onclick=()=>{if(cur&&!revealed){suggest=null;doReveal()}};
$('grades').onclick=e=>{const b=e.target.closest('button');if(b)answerGrade(+b.dataset.g)};
$('next').onclick=()=>answerGrade(suggest===0?0:2);
$('flip').onclick=()=>{suggest=suggest===0?2:0;render()};
$('mic').onclick=async()=>{
  if(!cur||revealed||micBlocked)return;
  const b=$('mic');b.classList.add('listening');b.lastChild.textContent='Listening…';
  const [,lang]=answerOf(cur);
  const heard=await listen(lang,6000,h=>{if(h){feedback={cls:'info',text:'Heard: '+h};render();b.classList.add('listening')}});
  b.classList.remove('listening');b.lastChild.textContent='Speak';
  if(heard===null)return render();
  const ok=judge(cur,heard);tone(ok);
  lastHeard=heard[0]||'';feedback=heard.length?{cls:ok?'ok':'no',text:(ok?'Correct — heard “':'Not quite — heard “')+heard[0]+'”'+(ok&&casualHit(cur,heard)?' · casual form':'')}:{cls:'no',text:'Didn’t catch anything'};
  suggest=ok?2:0;doReveal();
};
function setDir(d){if(walking)stopWalk();S.set.dir=d;save();lastId=null;show()}
document.querySelector('.decks').onclick=e=>{const b=e.target.closest('[data-deck]');if(!b)return;const d=b.dataset.deck;
  const on=S.set.decks.includes(d);if(on&&S.set.decks.length===1)return;
  S.set.decks=on?S.set.decks.filter(x=>x!==d):[...S.set.decks,d];save();if(walking)stopWalk();lastId=null;show()};
$('dJE').onclick=()=>setDir('je');$('dEJ').onclick=()=>setDir('ej');

/* ---------- settings ---------- */
const bind=(id,key,num)=>{const el=$(id);el.value=String(S.set[key]);el.onchange=()=>{S.set[key]=num?+el.value:el.value;save();render()}};
bind('sRuby','ruby');$('sTypes').value=S.set.types;$('sTypes').onchange=()=>{S.set.types=$('sTypes').value;save();if(walking)stopWalk();lastId=null;show()};bind('sNew','newPerDay',1);bind('sGap','gap',1);bind('sRate','rate',1);bind('sAuto','auto',1);
$('setBtn').onclick=()=>{const s=$('settings');s.hidden=!s.hidden;$('setBtn').setAttribute('aria-expanded',!s.hidden)};
let resetArmed=false;
$('reset').onclick=()=>{if(!resetArmed){resetArmed=true;$('reset').textContent='Tap again to erase all progress';setTimeout(()=>{resetArmed=false;$('reset').textContent='Reset all progress'},4000);return}
  S.cards={};S.newDone={je:0,ej:0};save();resetArmed=false;$('reset').textContent='Progress reset';lastId=null;show()};

/* ---------- walk mode ---------- */
let walking=false,wake=null,graceRes=null;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function status(t){$('wStatus').textContent=t}
function grace(label,ms){return new Promise(res=>{
  const box=$('grace');box.hidden=false;box.innerHTML=`<button class="btn" id="gBtn">${label}</button>`;
  let done=false;const fin=v=>{if(done)return;done=true;box.hidden=true;graceRes=null;res(v)};
  graceRes=fin;$('gBtn').onclick=()=>fin(true);setTimeout(()=>fin(false),ms);
})}
function parseCmd(t){t=t.toLowerCase();
  if(/repeat|again|one more|say it|pardon|もう一回|もう一度|リピート/.test(t))return 'repeat';
  if(/wrong|missed|incorrect|didn.?t know|違う|ちがう/.test(t))return 'wrong';
  if(/right|correct|got it|yes/.test(t))return 'right';
  if(/next|skip|carry on|continue|go on/.test(t))return 'next';
  return null}
// after each answer: buttons + spoken commands ("repeat", "wrong", "right", "next")
function commandWindow(flipLabel,ms){return new Promise(res=>{
  const box=$('grace');box.hidden=false;
  box.innerHTML=`<button class="btn" data-c="repeat">↻ Repeat</button><button class="btn" data-c="flip">${flipLabel}</button><button class="btn primary" data-c="next">Next →</button>`;
  let done=false,t;const fin=v=>{if(done)return;done=true;clearTimeout(t);box.hidden=true;graceRes=null;try{curRec&&curRec.abort()}catch(e){}res(v)};
  graceRes=fin;box.onclick=e=>{const b=e.target.closest('[data-c]');if(b)fin(b.dataset.c)};
  t=setTimeout(()=>fin(null),ms);
  if(!micBlocked)listen('en-GB',ms-300).then(h=>{if(h&&h.length){const c=parseCmd(h.join(' '));if(c)fin(c)}});
})}
async function replay(){const pr=promptOf(cur),an=answerOf(cur);if(pr){await speak(pr[0],pr[1]);await wait(700)}if(walking)await speak(an[0],an[1])}
async function afterAnswer(ok){
  for(let i=0;i<6&&walking;i++){
    status((ok?'Marked right':'Marked wrong')+' — say “repeat”, “'+(ok?'wrong':'right')+'” or “next”');
    const c=await commandWindow(ok?'✗ I got it wrong':'✓ I was right',micBlocked?3500:4500);
    if(!walking)return ok;
    if(c==='repeat'){status('Repeating…');await replay();continue}
    if(c==='flip')ok=!ok;else if(c==='wrong')ok=false;else if(c==='right')ok=true;
    return ok;
  }
  return ok;
}
// after a wrong answer: wait for the learner to say the correct answer back (up to 3 tries)
async function sayItBack(al){
  const [rt,rl]=answerOf(cur);
  for(let i=0;i<3&&walking;i++){
    status('Now say it back'+(i?' — try again':''));await wait(250);
    const h=await listen(al,S.set.gap*1000,x=>{if(x){feedback={cls:'info',text:'Heard: '+x};render()}});
    if(!walking||h===null)return;
    if(judge(cur,h)){tone(true);feedback={cls:'ok',text:'Nice — you said it right'};render();status('Nice — you said it right');await wait(700);return}
    tone(false);feedback={cls:'no',text:h.length?'Heard “'+h[0]+'” — listen again':'Didn’t catch that — listen again'};render();
    if(i<2){await wait(300);await speak(rt,rl)}
  }
  status('Moving on — this one will come back soon');await wait(600);
}
async function walkLoop(){
  while(walking){
    cur=nextCard();revealed=false;feedback=null;suggest=null;showAlts=false;showFix=false;fixText='';lastHeard='';render();
    if(!cur){status('All done for now');await speak('All done for now. Great work.','en-GB');stopWalk();break}
    const pr=promptOf(cur);const [,al]=answerOf(cur);
    if(pr){status('Listen…');await speak(pr[0],pr[1])}else{status('Read the card…');await wait(700)}if(!walking)break;
    let ok=true;
    if(S.set.walkMode==='listen'||micBlocked){
      // listen-only: think of the answer, then hear it
      for(let s=S.set.gap;s>0&&walking;s--){status('Think of the answer… '+s);await wait(1000)}
      if(!walking)break;
      status('Answer');await doReveal();if(!walking)break;
    }else{
      status('Your turn — say it '+(al.startsWith('ja')?'in Japanese':'in English'));
      const heard=await listen(al,S.set.gap*1000,h=>{if(h){feedback={cls:'info',text:'Heard: '+h};render()}});
      if(!walking)break;
      ok=heard!==null&&judge(cur,heard);tone(ok);
      lastHeard=heard&&heard[0]||'';feedback=heard&&heard.length?{cls:ok?'ok':'no',text:(ok?'Correct — heard “':'Not quite — heard “')+heard[0]+'”'+(ok&&casualHit(cur,heard)?' · casual form':'')}:{cls:'no',text:'Didn’t catch anything'};
      status(ok?'Correct':'Here’s the answer');await doReveal();if(!walking)break;
      if(!ok){await wait(500);const [rt,rl]=answerOf(cur);await speak(rt,rl);if(!walking)break;await sayItBack(al);if(!walking)break}
    }
    ok=await afterAnswer(ok);if(!walking)break;
    grade(cur,ok?2:0);lastId=cur.id;await wait(400);
  }
}
async function startWalk(){
  walking=true;userActed=true;
  $('walkBtn').lastChild.textContent='Stop walk mode';$('walkBtn').classList.remove('primary');
  $('walkModes').hidden=true;
  $('wHelp').innerHTML=walkHelp(true);
  try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  walkLoop();
}
function stopWalk(){
  walking=false;try{speechSynthesis.cancel()}catch(e){}try{curRec&&curRec.abort()}catch(e){}graceRes&&graceRes(false);
  try{wake&&wake.release()}catch(e){}wake=null;
  $('walkBtn').lastChild.textContent='Start walk mode';$('walkBtn').classList.add('primary');status('Walk mode');
  $('walkModes').hidden=false;$('wHelp').innerHTML=walkHelp(false);
  revealed=false;feedback=null;cur=nextCard();render();
}
function walkHelp(on){const L=S.set.walkMode==='listen'||micBlocked;
  const steps=L?['You hear the prompt.','Think of the answer during the pause.','You hear the translation.','Say <b>“repeat”</b> to hear it again, <b>“wrong”</b> if you missed it, or <b>“next”</b>. Say nothing and it counts as right.']
    :['You hear the prompt.','Say the answer out loud.','If you get it wrong, it says the correct answer and waits for you to <b>say it back</b> (up to 3 tries).','Then say <b>“repeat”</b>, <b>“wrong”</b>, <b>“right”</b> or <b>“next”</b>. Say nothing and it moves on.'];
  return `<ol>${steps.map(x=>`<li>${x}</li>`).join('')}</ol><p>Keep this screen on and the app open.${micBlocked&&!L?' Speaking back isn’t available here, so this works like Listen only.':''}</p>`}
function setWalkMode(m){S.set.walkMode=m;save();$('wmSpeak').setAttribute('aria-pressed',m==='speak');$('wmListen').setAttribute('aria-pressed',m==='listen');$('wHelp').innerHTML=walkHelp(false)}
$('wmSpeak').onclick=()=>setWalkMode('speak');$('wmListen').onclick=()=>setWalkMode('listen');
setWalkMode(S.set.walkMode);
$('walkBtn').onclick=()=>walking?stopWalk():startWalk();
document.addEventListener('visibilitychange',async()=>{if(walking&&document.visibilityState==='visible'&&!wake){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});

function showMicNote(){const n=$('micNote');n.hidden=false;
  n.innerHTML=SR?'<strong>Speaking back is blocked in this view.</strong> Open the file version of this app in Chrome or Safari to answer by voice. Everything else works here.':
  '<strong>This browser can’t listen.</strong> Use Chrome (Android, desktop) or Safari (iPhone) to answer by voice. You can still study by tapping.';render()}
if(micBlocked)showMicNote();

show();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
