<body>
<title>N5 Speaking Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone study app — header, direction switch, the card, controls pinned under it. Indigo ink on cool washi paper. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#152036; --muted:#5B6679; --line:#D5DBE5;
  --accent:#28418F; --accent-soft:#E2E8F7; --good:#23775A; --good-soft:#DDF0E7; --bad:#B0402C; --bad-soft:#F7E1DC; --hard:#9A6A12;
  --jp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#172034; --ink:#E6EAF2; --muted:#9AA4B7; --line:#2A3550;
  --accent:#93A9F2; --accent-soft:#222E4D; --good:#5CC79C; --good-soft:#163328; --bad:#EB8A76; --bad-soft:#3A1E1A; --hard:#E2B357; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#172034; --ink:#E6EAF2; --muted:#9AA4B7; --line:#2A3550;
  --accent:#93A9F2; --accent-soft:#222E4D; --good:#5CC79C; --good-soft:#163328; --bad:#EB8A76; --bad-soft:#3A1E1A; --hard:#E2B357; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--jp);font-size:22px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.counts{display:flex;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill{padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill strong{color:var(--ink);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 6px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:300px;position:relative}
.tag{position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag.new{color:var(--accent)}
.front{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-width:0;padding-top:18px}
.jp{font-family:var(--jp);font-weight:700;font-size:clamp(40px,13vw,64px);line-height:1.15;overflow-wrap:anywhere}
.jp.long{font-size:clamp(28px,8vw,40px)}
.jp rt{font-family:var(--ui);font-weight:500;font-size:.3em;color:var(--accent);letter-spacing:.03em;padding-bottom:4px}
.en-front{font-size:clamp(26px,8vw,36px);font-weight:500;text-wrap:balance}
.answer{width:100%;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.answer .jp{font-size:34px}
.answer .kana{color:var(--muted);font-family:var(--jp);font-size:16px}
.answer .en{font-size:20px;font-weight:600;text-wrap:balance}
.feedback{font-size:14px;padding:7px 12px;border-radius:10px;text-align:center;max-width:100%;overflow-wrap:anywhere}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.listening{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}
.grades small{font-weight:400;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.grades button[data-g="0"]{color:var(--bad)} .grades button[data-g="1"]{color:var(--hard)}
.grades button[data-g="2"]{color:var(--good)} .grades button[data-g="3"]{color:var(--accent)}
.grades button.suggest{outline:2px solid currentColor;outline-offset:-2px}
.after{display:flex;flex-direction:column;gap:10px}
.after .row .btn{padding:16px 10px}
.next{flex:1.4;font-size:17px;font-weight:600}
#flip.wrong{color:var(--bad);border-color:var(--bad)}
#flip.right{color:var(--good);border-color:var(--good)}
.mark{text-align:center;font-size:13px;color:var(--muted)}
.mark b{font-weight:600}.mark .ok{color:var(--good)}.mark .no{color:var(--bad)}
.more summary{font-size:13px;color:var(--muted);cursor:pointer;text-align:center;list-style:none;padding:4px}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{margin-bottom:8px}
.walk{border-radius:16px;padding:14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px}
.walk p{margin:0;font-size:13.5px;color:var(--muted)}
.walk .status{font-size:17px;font-weight:600;color:var(--ink);min-height:1.45em}
.grace{display:flex;gap:10px}
.notice{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.notice strong{color:var(--ink)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.settings select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.danger{color:var(--bad);font-weight:500;justify-self:start;padding:4px 0}
.done{text-align:center;color:var(--muted)}
.done b{display:block;font-family:var(--jp);font-size:30px;color:var(--ink);margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.btn.listening svg{animation:pulse 1s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(1.25)}}
</style>

<div class="app">
  <header>
    <div class="brand"><b>日本語</b><span>JLPT N5</span></div>
    <div class="counts"><span class="pill"><strong id="cDue">0</strong> due</span><span class="pill"><strong id="cNew">0</strong> new</span></div>
    <button class="iconbtn" id="setBtn" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>

  <div class="settings" id="settings" hidden>
    <label>Reading above kanji <select id="sRuby"><option value="romaji">Romaji</option><option value="kana">Hiragana</option><option value="none">None</option></select></label>
    <label>New cards per day <select id="sNew"><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option></select></label>
    <label>Time to answer (walk mode) <select id="sGap"><option value="4">4 s</option><option value="6">6 s</option><option value="8">8 s</option><option value="10">10 s</option></select></label>
    <label>Japanese voice speed <select id="sRate"><option value="0.7">Slow</option><option value="0.85">Relaxed</option><option value="1">Natural</option></select></label>
    <label>Play audio when a card appears <select id="sAuto"><option value="1">On</option><option value="0">Off</option></select></label>
    <button class="danger" id="reset">Reset all progress</button>
  </div>

  <div class="seg" role="group" aria-label="Direction">
    <button id="dJE" aria-pressed="true">日本語 → English</button>
    <button id="dEJ" aria-pressed="false">English → 日本語</button>
  </div>

  <div class="card" id="card"></div>

  <div class="row" id="actions">
    <button class="btn" id="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>Play</button>
    <button class="btn" id="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Speak</button>
    <button class="btn primary" id="reveal">Show answer</button>
  </div>
  <div class="after" id="after" hidden>
    <div class="row">
      <button class="btn" id="flip"></button>
      <button class="btn primary next" id="next">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="mark" id="mark"></div>
    <details class="more"><summary>Rate it yourself</summary><div class="grades" id="grades"></div></details>
  </div>

  <div class="walk">
    <div class="status" id="wStatus">Walk mode</div>
    <p id="wHelp">Hands-free: it says the prompt, you answer out loud, it marks you and schedules the card. Keep the screen on.</p>
    <div class="grace" id="grace" hidden></div>
    <button class="btn primary" id="walkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1.6"/><path d="M10 21l2-6-2.5-2.5L11 8l4 3 3 1M9.5 12.5L7 14M12 15l3 2 1 4"/></svg><span>Start walk mode</span></button>
  </div>

  <div class="notice" id="micNote" hidden></div>
</div>

<script>
// kanji | kana | romaji | English (alternatives split by ;) | extra accepted answers
const RAW=`おはようございます|おはようございます|ohayō gozaimasu|good morning

少ない|すくない|sukunai|few; a little|少し,not many

const CARDS=RAW.trim().split('\n').map((l,i)=>{const [k,kana,r,en,alts]=l.split('|');return{id:k+'/'+kana,k,kana,r,en,alts:alts?alts.split(','):[]}});

/* ---------- storage ---------- */
const KEY='n5-speaking-v1';
let S={cards:{},day:'',newDone:{je:0,ej:0},set:{dir:'je',ruby:'romaji',newPerDay:10,gap:6,rate:0.85,auto:1}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s){S={...S,...s,set:{...S.set,...(s.set||{})}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function rollDay(){if(S.day!==today()){S.day=today();S.newDone={je:0,ej:0};save()}}
rollDay();

/* ---------- scheduler (Anki-style SM-2 with learning steps) ---------- */
const MIN=60e3,DAY=864e5,STEPS=[1,10];
const ck=c=>S.set.dir+':'+c.id;
const st=c=>S.cards[ck(c)];
function schedule(cs,g,now){
  cs=cs?{...cs}:{ivl:0,ease:2.5,reps:0,lapses:0,step:0,learning:true};
  cs.reps++;
  if(cs.learning){
    if(g===0){cs.step=0;cs.due=now+STEPS[0]*MIN}
    else if(g===1){cs.due=now+Math.round(STEPS[cs.step]*1.5)*MIN}
    else if(g===2){cs.step++;if(cs.step>=STEPS.length){cs.learning=false;cs.ivl=Math.max(1,cs.ivl);cs.due=now+cs.ivl*DAY}else cs.due=now+STEPS[cs.step]*MIN}
    else{cs.learning=false;cs.ivl=cs.ivl>0?cs.ivl+1:4;cs.due=now+cs.ivl*DAY}
  }else{
    if(g===0){cs.lapses++;cs.ease=Math.max(1.3,cs.ease-.2);cs.ivl=Math.max(1,Math.round(cs.ivl*.5));cs.learning=true;cs.step=1;cs.due=now+STEPS[1]*MIN}
    else{
      if(g===1){cs.ivl=Math.max(cs.ivl+1,Math.round(cs.ivl*1.2));cs.ease=Math.max(1.3,cs.ease-.15)}
      if(g===2){cs.ivl=Math.max(cs.ivl+1,Math.round(cs.ivl*cs.ease))}
      if(g===3){cs.ivl=Math.max(cs.ivl+1,Math.round(cs.ivl*cs.ease*1.3));cs.ease+=.15}
      cs.due=now+cs.ivl*DAY;
    }
  }
  return cs;
}
function fmt(ms){const m=ms/MIN;if(m<60)return Math.max(1,Math.round(m))+'m';const h=m/60;if(h<24)return Math.round(h)+'h';const d=h/24;if(d<30)return Math.round(d)+'d';return (d/30).toFixed(1).replace('.0','')+'mo'}
function grade(c,g){
  rollDay();const now=Date.now();
  if(!st(c))S.newDone[S.set.dir]++;
  S.cards[ck(c)]=schedule(st(c),g,now);save();
}
function counts(){
  rollDay();const now=Date.now();let due=0,fresh=0;
  for(const c of CARDS){const s=st(c);if(!s)fresh++;else if(s.due<=now)due++}
  return{due,fresh:Math.min(fresh,Math.max(0,S.set.newPerDay-S.newDone[S.set.dir]))};
}
let lastId=null;
function nextCard(){
  rollDay();const now=Date.now();
  const pick=list=>{list.sort((a,b)=>st(a).due-st(b).due);const f=list.find(c=>c.id!==lastId);return f||list[0]};
  const due=CARDS.filter(c=>{const s=st(c);return s&&s.due<=now});
  if(due.length>1||(due.length===1&&due[0].id!==lastId))return pick(due);
  if(S.newDone[S.set.dir]<S.set.newPerDay){const n=CARDS.find(c=>!st(c)&&c.id!==lastId);if(n)return n}
  if(due.length)return due[0];
  const ahead=CARDS.filter(c=>{const s=st(c);return s&&s.learning&&s.due<=now+20*MIN});
  if(ahead.length)return pick(ahead);
  return null;
}

/* ---------- speech out ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(lang){const L=lang.toLowerCase();const n=v=>v.lang.replace('_','-').toLowerCase();
  return voices.find(v=>n(v)===L&&/google|siri|enhanced|premium|natural/i.test(v.name))||voices.find(v=>n(v)===L)||voices.find(v=>n(v).startsWith(L.slice(0,2)))}
function speak(text,lang){return new Promise(res=>{
  if(!('speechSynthesis' in window))return res();
  const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;
  u.rate=lang.startsWith('ja')?+S.set.rate:1;
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(t);res()};
  u.onend=fin;u.onerror=fin;const t=setTimeout(fin,3000+text.length*300);
  if(speechSynthesis.speaking)speechSynthesis.cancel();
  speechSynthesis.speak(u);
})}
const enSay=c=>c.en.replace(/\(.*?\)/g,'').split(';').map(s=>s.trim()).join(', or ');
const promptOf=c=>S.set.dir==='je'?[c.kana,'ja-JP']:[enSay(c),'en-GB'];
const answerOf=c=>S.set.dir==='je'?[enSay(c),'en-GB']:[c.kana,'ja-JP'];

let actx;
function tone(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  (ok?[660,880]:[300,220]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='sine';
    g.gain.setValueAtTime(0,t+i*.13);g.gain.linearRampToValueAtTime(.18,t+i*.13+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.13+.22);
    o.connect(g).connect(actx.destination);o.start(t+i*.13);o.stop(t+i*.13+.25)})}catch(e){}}

/* ---------- speech in ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=!SR,curRec=null;
function listen(lang,ms,onHeard){return new Promise(res=>{
  let rec,t,finished=false,alts=[],interim='';
  const finish=v=>{if(finished)return;finished=true;clearTimeout(t);curRec=null;try{rec&&rec.abort()}catch(e){}res(v)};
  try{rec=new SR()}catch(e){return finish(null)}
  curRec=rec;rec.lang=lang;rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){for(let j=0;j<r.length;j++)alts.push(r[j].transcript)}else interim=r[0].transcript}onHeard&&onHeard(alts[0]||interim)};
  rec.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){micBlocked=true;showMicNote();finish(null)}};
  rec.onend=()=>finish(alts.length?alts:interim?[interim]:[]);
  t=setTimeout(()=>{try{rec.stop()}catch(e){}t=setTimeout(()=>finish(alts.length?alts:interim?[interim]:[]),900)},ms);
  try{rec.start()}catch(e){finish(null)}
})}

/* ---------- answer checking ---------- */
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
const NUM={one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'};
function normEn(s){s=s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/^(to|the|a|an|my|it's|its|it is)\s+/,'');return s.split(' ').map(w=>NUM[w]||w).join(' ')}
function normJa(s){return s.replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/[\s。、，．！？!?.,「」]/g,'')}
function judge(c,heard){
  if(!heard||!heard.length)return false;
  if(S.set.dir==='je'){
    const T=[...c.en.split(';'),c.en,...c.alts].map(normEn).filter(Boolean);
    return heard.some(h=>{h=normEn(h);return T.some(t=>h===t||(' '+h+' ').includes(' '+t+' ')||sim(h,t)>=.8)});
  }
  const T=[c.k,c.kana,...c.alts].map(normJa);
  return heard.some(h=>{h=normJa(h);return T.some(t=>h===t||(t.length>1&&h.includes(t))||sim(h,t)>=.75)});
}

/* ---------- rendering ---------- */
const $=id=>document.getElementById(id);
let cur=null,revealed=false,feedback=null,suggest=null;
function ruby(c){
  const mode=S.set.ruby;const rt=mode==='romaji'?c.r:mode==='kana'&&c.k!==c.kana?c.kana:'';
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return rt?`<ruby>${esc(c.k)}<rt>${esc(rt)}</rt></ruby>`:esc(c.k);
}
function render(){
  const k=counts();$('cDue').textContent=k.due;$('cNew').textContent=k.fresh;
  $('dJE').setAttribute('aria-pressed',S.set.dir==='je');$('dEJ').setAttribute('aria-pressed',S.set.dir==='ej');
  const card=$('card');
  if(!cur){card.innerHTML=`<div class="front"><div class="done"><b>お疲れさま</b>You're done for now. Come back later for reviews, or raise new cards per day in settings.</div></div>`;
    $('actions').hidden=true;$('grades').hidden=true;return}
  $('actions').hidden=false;
  const isNew=!st(cur);const long=cur.k.length>5;
  const front=S.set.dir==='je'?`<div class="jp${long?' long':''}">${ruby(cur)}</div>`:`<div class="en-front">${cur.en}</div>`;
  let html=`<span class="tag${isNew?' new':''}">${isNew?'New card':'Review'}</span><div class="front">${front}</div>`;
  if(feedback)html+=`<div class="feedback ${feedback.cls}">${feedback.text}</div>`;
  if(revealed){
    html+=`<div class="answer">${S.set.dir==='je'?`<div class="en">${cur.en}</div><div class="kana">${cur.kana} · ${cur.r}</div>`:
      `<div class="jp">${ruby(cur)}</div><div class="kana">${cur.kana} · ${cur.r}</div>`}</div>`;
  }
  card.innerHTML=html;
  $('actions').hidden=revealed;
  $('mic').disabled=micBlocked;
  $('after').hidden=!revealed||walking;
  if(revealed){const now=Date.now(),s=st(cur);
    const wrong=suggest===0;
    const f=$('flip');f.className='btn '+(wrong?'right':'wrong');f.textContent=wrong?'✓ I was right':'✗ I got it wrong';
    $('mark').innerHTML=wrong?`Marked <b class="no">wrong</b> · back in ${fmt(schedule(s,0,now).due-now)}`:`Marked <b class="ok">right</b> · next in ${fmt(schedule(s,2,now).due-now)}`;
    $('grades').innerHTML=['Again','Hard','Good','Easy'].map((n,i)=>`<button data-g="${i}">${n}<small>${fmt(schedule(s,i,now).due-now)}</small></button>`).join('')}
}
function show(){cur=nextCard();revealed=false;feedback=null;suggest=null;render();
  if(cur&&+S.set.auto&&!walking&&userActed){const [t,l]=promptOf(cur);speak(t,l)}}
function doReveal(){revealed=true;render();const [t,l]=answerOf(cur);return speak(t,l)}
function answerGrade(g){if(!cur)return;grade(cur,g);lastId=cur.id;show()}

/* ---------- manual controls ---------- */
let userActed=false;
document.addEventListener('pointerdown',()=>{userActed=true},{once:true,capture:true});
$('play').onclick=()=>{if(!cur)return;const [t,l]=revealed?answerOf(cur):promptOf(cur);speak(t,l)};
$('reveal').onclick=()=>{if(cur&&!revealed){suggest=null;doReveal()}};
$('grades').onclick=e=>{const b=e.target.closest('button');if(b)answerGrade(+b.dataset.g)};
$('next').onclick=()=>answerGrade(suggest===0?0:2);
$('flip').onclick=()=>{suggest=suggest===0?2:0;render()};
$('mic').onclick=async()=>{
  if(!cur||revealed||micBlocked)return;
  const b=$('mic');b.classList.add('listening');b.lastChild.textContent='Listening…';
  const [,lang]=answerOf(cur);
  const heard=await listen(lang,6000,h=>{if(h){feedback={cls:'info',text:'Heard: '+h};render();b.classList.add('listening')}});
  b.classList.remove('listening');b.lastChild.textContent='Speak';
  if(heard===null)return render();
  const ok=judge(cur,heard);tone(ok);
  feedback=heard.length?{cls:ok?'ok':'no',text:(ok?'Correct — heard “':'Not quite — heard “')+heard[0]+'”'}:{cls:'no',text:'Didn’t catch anything'};
  suggest=ok?2:0;doReveal();
};
function setDir(d){if(walking)stopWalk();S.set.dir=d;save();lastId=null;show()}
$('dJE').onclick=()=>setDir('je');$('dEJ').onclick=()=>setDir('ej');

/* ---------- settings ---------- */
const bind=(id,key,num)=>{const el=$(id);el.value=String(S.set[key]);el.onchange=()=>{S.set[key]=num?+el.value:el.value;save();render()}};
bind('sRuby','ruby');bind('sNew','newPerDay',1);bind('sGap','gap',1);bind('sRate','rate',1);bind('sAuto','auto',1);
$('setBtn').onclick=()=>{const s=$('settings');s.hidden=!s.hidden;$('setBtn').setAttribute('aria-expanded',!s.hidden)};
let resetArmed=false;
$('reset').onclick=()=>{if(!resetArmed){resetArmed=true;$('reset').textContent='Tap again to erase all progress';setTimeout(()=>{resetArmed=false;$('reset').textContent='Reset all progress'},4000);return}
  S.cards={};S.newDone={je:0,ej:0};save();resetArmed=false;$('reset').textContent='Progress reset';lastId=null;show()};

/* ---------- walk mode ---------- */
let walking=false,wake=null,graceRes=null;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function status(t){$('wStatus').textContent=t}
function grace(label,ms){return new Promise(res=>{
  const box=$('grace');box.hidden=false;box.innerHTML=`<button class="btn" id="gBtn">${label}</button>`;
  let done=false;const fin=v=>{if(done)return;done=true;box.hidden=true;graceRes=null;res(v)};
  graceRes=fin;$('gBtn').onclick=()=>fin(true);setTimeout(()=>fin(false),ms);
})}
async function walkLoop(){
  while(walking){
    cur=nextCard();revealed=false;feedback=null;suggest=null;render();
    if(!cur){status('All done for now');await speak('All done for now. Great work.','en-GB');stopWalk();break}
    const [pt,pl]=promptOf(cur);const [,al]=answerOf(cur);
    status('Listen…');await speak(pt,pl);if(!walking)break;
    let ok;
    if(!micBlocked){
      status('Your turn — say it '+(al.startsWith('ja')?'in Japanese':'in English'));
      const heard=await listen(al,S.set.gap*1000,h=>{if(h){feedback={cls:'info',text:'Heard: '+h};render()}});
      if(!walking)break;
      if(heard!==null){
        ok=judge(cur,heard);tone(ok);
        feedback=heard.length?{cls:ok?'ok':'no',text:(ok?'Correct — heard “':'Not quite — heard “')+heard[0]+'”'}:{cls:'no',text:'Didn’t catch anything'};
        status(ok?'Correct':'Here’s the answer');await doReveal();if(!walking)break;
        if(!ok){await wait(500);const [rt,rl]=answerOf(cur);await speak(rt,rl);if(!walking)break;
          status('Marked wrong — tap if you were right');if(await grace('✓ I was right',3000))ok=true}
        else{status('Marked right — tap if it was wrong');if(await grace('✗ I got it wrong',2500))ok=false}
        grade(cur,ok?2:0);lastId=cur.id;await wait(500);continue;
      }
    }
    // no microphone here: timed pause, then the answer
    for(let s=S.set.gap;s>0&&walking;s--){status('Say it out loud… '+s);await wait(1000)}
    if(!walking)break;
    status('Answer');await doReveal();if(!walking)break;
    status('Tap if you missed it');const missed=await grace('✗ I got it wrong',3500);
    grade(cur,missed?0:2);lastId=cur.id;await wait(400);
  }
}
async function startWalk(){
  walking=true;userActed=true;
  $('walkBtn').lastChild.textContent='Stop walk mode';$('walkBtn').classList.remove('primary');
  $('wHelp').textContent=micBlocked?'Speaking back isn’t available here, so you get a pause to answer, then the answer. Tap “I missed it” if you got it wrong.':'Answer out loud after each prompt. Keep this screen on and open.';
  try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  walkLoop();
}
function stopWalk(){
  walking=false;try{speechSynthesis.cancel()}catch(e){}try{curRec&&curRec.abort()}catch(e){}graceRes&&graceRes(false);
  try{wake&&wake.release()}catch(e){}wake=null;
  $('walkBtn').lastChild.textContent='Start walk mode';$('walkBtn').classList.add('primary');status('Walk mode');
  $('wHelp').textContent='Hands-free: it says the prompt, you answer out loud, it marks you and schedules the card. Keep the screen on.';
  revealed=false;feedback=null;cur=nextCard();render();
}
$('walkBtn').onclick=()=>walking?stopWalk():startWalk();
document.addEventListener('visibilitychange',async()=>{if(walking&&document.visibilityState==='visible'&&!wake){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});

function showMicNote(){const n=$('micNote');n.hidden=false;
  n.innerHTML=SR?'<strong>Speaking back is blocked in this view.</strong> Open the file version of this app in Chrome or Safari to answer by voice. Everything else works here.':
  '<strong>This browser can’t listen.</strong> Use Chrome (Android, desktop) or Safari (iPhone) to answer by voice. You can still study by tapping.';render()}
if(micBlocked)showMicNote();

show();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
