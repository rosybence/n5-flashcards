<title>Spanish Speaking Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone study app — header, level picker, direction switch, the card, controls under it. Olive-green ink on limewashed paper, Fraunces for Spanish words. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#18241F; --muted:#5C6962; --line:#D4DBD5;
  --accent:#1E6B57; --accent-soft:#DDEEE7; --good:#23775A; --good-soft:#DDF0E7; --bad:#B0402C; --bad-soft:#F7E1DC; --hard:#9A6A12; --casual:#8A5300; --casual-soft:#FBEBCB;
  --word:"Fraunces",Georgia,"Times New Roman",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#18221E; --ink:#E5ECE8; --muted:#9AA8A1; --line:#2A3832;
  --accent:#7FCBB3; --accent-soft:#1E3129; --good:#5CC79C; --good-soft:#163328; --bad:#EB8A76; --bad-soft:#3A1E1A; --hard:#E2B357; --casual:#EDBB62; --casual-soft:#3B2C12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18221E; --ink:#E5ECE8; --muted:#9AA8A1; --line:#2A3832;
  --accent:#7FCBB3; --accent-soft:#1E3129; --good:#5CC79C; --good-soft:#163328; --bad:#EB8A76; --bad-soft:#3A1E1A; --hard:#E2B357; --casual:#EDBB62; --casual-soft:#3B2C12; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--word);font-size:24px;font-weight:700}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.counts{display:flex;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill{padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill strong{color:var(--ink);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
.decks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.decks button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--muted)}
.decks b{font-family:var(--word);font-size:19px;font-weight:700;color:var(--ink);line-height:1.2}
.decks button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.decks button[aria-pressed="true"] b{color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 6px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:280px;position:relative}
.tag{position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag.new{color:var(--accent)}
.front{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-width:0;padding-top:18px}
.es{font-family:var(--word);font-weight:700;font-size:clamp(34px,11vw,52px);line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.es.long{font-size:clamp(24px,7vw,32px)}
.es .art{font-weight:500;color:var(--muted)}
.en-front{font-size:clamp(24px,7.5vw,34px);font-weight:500;text-wrap:balance}
.answer{width:100%;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.answer .pic{font-size:64px;line-height:1.1;margin-bottom:4px;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.answer .es{font-size:30px}
.answer .en{font-size:20px;font-weight:600;text-wrap:balance}
.fixarea{display:flex;flex-direction:column;align-items:center}
#fbBar{align-self:center}
.fix-btn{margin-top:4px;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}
.fix{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;box-sizing:border-box}
.fix-kinds{display:flex;flex-wrap:wrap;gap:6px}
.fix-kinds button{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.fix-kinds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.fix-label{font-size:13px;color:var(--muted)}
.fix input{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.fix-note{margin:0;font-size:12.5px;color:var(--muted)}
.fix .btn{text-decoration:none;font-size:14px;padding:11px 8px}
.alts-btn{margin-top:8px;font-size:13.5px;font-weight:500;color:var(--accent);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.alts{display:flex;flex-direction:column;gap:8px;margin-top:6px;width:100%}
.alts .grp{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.alts .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.chip{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.esc{font-family:var(--word);font-size:16px}
.chip.casual{background:var(--casual-soft);color:var(--casual)}
.chip small{font-family:var(--ui);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:4px;border:1px solid currentColor}
.feedback{font-size:14px;padding:7px 12px;border-radius:10px;text-align:center;max-width:100%;overflow-wrap:anywhere}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.listening{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}
.grades small{font-weight:400;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.grades button[data-g="0"]{color:var(--bad)} .grades button[data-g="1"]{color:var(--hard)}
.grades button[data-g="2"]{color:var(--good)} .grades button[data-g="3"]{color:var(--accent)}
.after{display:flex;flex-direction:column;gap:10px}
.after .row .btn{padding:16px 10px}
.next{flex:1.4;font-size:17px;font-weight:600}
#flip.wrong{color:var(--bad);border-color:var(--bad)}
#flip.right{color:var(--good);border-color:var(--good)}
.mark{text-align:center;font-size:13px;color:var(--muted)}
.mark b{font-weight:600}.mark .ok{color:var(--good)}.mark .no{color:var(--bad)}
.more summary{font-size:13px;color:var(--muted);cursor:pointer;text-align:center;list-style:none;padding:4px}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{margin-bottom:8px}
.walk{border-radius:16px;padding:14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px}
.walk .status{font-size:17px;font-weight:600;color:var(--ink);min-height:1.45em}
.grace{display:flex;gap:8px}
#pocket{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding-bottom:max(40px,env(safe-area-inset-bottom,0px));touch-action:none;user-select:none;-webkit-user-select:none}
#pocket p{margin:0;color:#262626;font-size:12px;text-align:center}
.grace .btn{padding:14px 6px;font-size:14px}
.whelp{font-size:13.5px;color:var(--muted)}
.whelp ol{margin:0;padding-left:20px;display:grid;gap:4px}
.whelp p{margin:8px 0 0}
.whelp b{color:var(--ink);font-weight:600}
.walkseg{background:var(--surface)}
.notice{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.notice strong{color:var(--ink)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.settings select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.voicerow{display:grid;gap:6px;font-size:14px}
.vr{display:flex;gap:8px}
.vr select{flex:1;min-width:0}
.test{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:500;white-space:nowrap}
.vnote{margin:0;font-size:12.5px;color:var(--muted)}
.vnote b{color:var(--ink);font-weight:600}
.danger{color:var(--bad);font-weight:500;justify-self:start;padding:4px 0}
.done{text-align:center;color:var(--muted)}
.done b{display:block;font-family:var(--word);font-size:30px;color:var(--ink);margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.btn.listening svg{animation:pulse 1s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(1.25)}}
</style>

<div class="app">
  <header>
    <div class="brand"><b>Español</b><span id="brandSub">A1</span></div>
    <div class="counts"><span class="pill"><strong id="cDue">0</strong> due</span><span class="pill"><strong id="cNew">0</strong> new</span></div>
    <button class="iconbtn" id="setBtn" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>

  <div class="settings" id="settings" hidden>
    <label>Cards <select id="sTypes"><option value="both">Words and phrases</option><option value="words">Words only</option><option value="phrases">Phrases only</option></select></label>
    <label>New cards per day <select id="sNew"><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option></select></label>
    <label>Time to answer (walk mode) <select id="sGap"><option value="4">4 s</option><option value="6">6 s</option><option value="8">8 s</option><option value="10">10 s</option></select></label>
    <label>Spanish voice speed <select id="sRate"><option value="0.7">Slow</option><option value="0.85">Relaxed</option><option value="1">Natural</option></select></label>
    <label>Play audio when a card appears <select id="sAuto"><option value="1">On</option><option value="0">Off</option></select></label>
    <div class="voicerow"><label for="sVoiceT">Spanish voice</label><div class="vr"><select id="sVoiceT"></select><button class="test" data-test="t">▶ Test</button></div></div>
    <div class="voicerow"><label for="sVoiceE">English voice</label><div class="vr"><select id="sVoiceE"></select><button class="test" data-test="e">▶ Test</button></div></div>
    <p class="vnote" id="vNote"></p>
    <button class="danger" id="reset">Reset all progress</button>
  </div>

  <div class="decks" role="group" aria-label="Levels">
    <button data-deck="a1" aria-pressed="true"><b>A1</b>Beginner</button>
    <button data-deck="a2" aria-pressed="false"><b>A2</b>Elementary</button>
    <button data-deck="b1" aria-pressed="false"><b>B1</b>Intermediate</button>
  </div>

  <div class="seg" role="group" aria-label="Direction">
    <button id="dJE" aria-pressed="true">Español → English</button>
    <button id="dEJ" aria-pressed="false">English → Español</button>
  </div>

  <div class="card" id="card"></div>
  <div class="feedback" id="fbBar" hidden></div>

  <div class="row" id="actions">
    <button class="btn" id="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>Play</button>
    <button class="btn" id="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Speak</button>
    <button class="btn primary" id="reveal">Show answer</button>
  </div>
  <div class="after" id="after" hidden>
    <div class="row">
      <button class="btn" id="flip"></button>
      <button class="btn primary next" id="next">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="mark" id="mark"></div>
    <details class="more"><summary>Rate it yourself</summary><div class="grades" id="grades"></div></details>
    <div id="fixArea" class="fixarea"></div>
  </div>

  <div class="walk">
    <div class="status" id="wStatus">Walk mode</div>
    <div class="seg walkseg" id="walkModes" role="group" aria-label="Walk mode type">
      <button id="wmSpeak" aria-pressed="true">Speak answers</button>
      <button id="wmListen" aria-pressed="false">Listen only</button>
    </div>
    <div id="wHelp" class="whelp"></div>
    <div class="grace" id="grace" hidden></div>
    <button class="btn primary" id="walkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1.6"/><path d="M10 21l2-6-2.5-2.5L11 8l4 3 3 1M9.5 12.5L7 14M12 15l3 2 1 4"/></svg><span>Start walk mode</span></button>
    <button class="btn" id="pocketBtn" hidden>Black screen (pocket mode)</button>
  </div>
  <div id="pocket" hidden><p id="pocketStatus"></p><p>Hold anywhere for 2 seconds to show the screen</p></div>

  <div class="notice" id="micNote" hidden></div>
</div>

<script>
/*DATA*/
/* each row: [spanish, english, otherSpanish[], otherEnglish[], picture]; a leading ~ marks a casual form */
const LEVELS={a1:'A1',a2:'A2',b1:'B1'};
function build(rows,type,deck){return rows.map(([es,en,esA,enA,pic])=>{
  const strip=a=>a.map(x=>x.replace(/^~/,''));
  return{id:deck+':'+es+'|'+en,es,en,type,deck,pic:pic||'',esA:strip(esA),enA:strip(enA),
    casual:new Set([...esA,...enA].filter(x=>x[0]==='~').map(x=>x.slice(1)))}})}
const CARDS=[];
for(const d of ['a1','a2','b1']){
  const W=build(DATA[d+'w'],'w',d),P=build(DATA[d+'p'],'p',d);let p=0;
  W.forEach((w,i)=>{if(i%3===0&&p<P.length)CARDS.push(P[p++]);CARDS.push(w)});while(p<P.length)CARDS.push(P[p++]);
}

/* ---------- storage ---------- */
const KEY='es-speaking-v1';
let S={cards:{},day:'',newDone:{je:0,ej:0},set:{dir:'je',newPerDay:10,gap:6,rate:0.85,auto:1,types:'both',decks:['a1'],walkMode:'speak'}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s){S={...S,...s,set:{...S.set,...(s.set||{})}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function rollDay(){if(S.day!==today()){S.day=today();S.newDone={je:0,ej:0};save()}}
rollDay();
let _pk='',_pool=[];
const pool=()=>{const key=S.set.decks.join()+'/'+S.set.types;if(key!==_pk){_pk=key;_pool=CARDS.filter(c=>S.set.decks.includes(c.deck)&&(S.set.types==='both'||(S.set.types==='words')===(c.type==='w')))}return _pool};

/* ---------- scheduler (Anki-style SM-2 with learning steps) ---------- */
const MIN=60e3,DAY=864e5,STEPS=[1,10];
const ck=c=>S.set.dir+':'+c.id;
const st=c=>S.cards[ck(c)];
function schedule(cs,g,now){
  cs=cs?{...cs}:{ivl:0,ease:2.5,reps:0,lapses:0,step:0,learning:true};
  cs.reps++;
  if(cs.learning){
    if(g===0){cs.step=0;cs.due=now+STEPS[0]*MIN}
    else if(g===1){cs.due=now+Math.round(STEPS[cs.step]*1.5)*MIN}
    else if(g===2){cs.step++;if(cs.step>=STEPS.length){cs.learning=false;cs.ivl=Math.max(1,cs.ivl);cs.due=now+cs.ivl*DAY}else cs.due=now+STEPS[cs.step]*MIN}
    else{cs.learning=false;cs.ivl=cs.ivl>0?cs.ivl+1:4;cs.due=now+cs.ivl*DAY}
  }else{
    if(g===0){cs.lapses++;cs.ease=Math.max(1.3,cs.ease-.2);cs.ivl=Math.max(1,Math.round(cs.ivl*.5));cs.learning=true;cs.step=1;cs.due=now+STEPS[1]*MIN}
    else{
      if(g===1){cs.ivl=Math.max(cs.ivl+1,Math.round(cs.ivl*1.2));cs.ease=Math.max(1.3,cs.ease-.15)}
      if(g===2){cs.ivl=Math.max(cs.ivl+1,Math.round(cs.ivl*cs.ease))}
      if(g===3){cs.ivl=Math.max(cs.ivl+1,Math.round(cs.ivl*cs.ease*1.3));cs.ease+=.15}
      cs.due=now+cs.ivl*DAY;
    }
  }
  return cs;
}
function fmt(ms){const m=ms/MIN;if(m<60)return Math.max(1,Math.round(m))+'m';const h=m/60;if(h<24)return Math.round(h)+'h';const d=h/24;if(d<30)return Math.round(d)+'d';return (d/30).toFixed(1).replace('.0','')+'mo'}
function grade(c,g){rollDay();const now=Date.now();if(!st(c))S.newDone[S.set.dir]++;S.cards[ck(c)]=schedule(st(c),g,now);save()}
function counts(){
  rollDay();const now=Date.now();let due=0,fresh=0;
  for(const c of pool()){const s=st(c);if(!s)fresh++;else if(s.due<=now)due++}
  return{due,fresh:Math.min(fresh,Math.max(0,S.set.newPerDay-S.newDone[S.set.dir]))};
}
let lastId=null;
function nextCard(){
  rollDay();const now=Date.now();
  const pick=list=>{list.sort((a,b)=>st(a).due-st(b).due);const f=list.find(c=>c.id!==lastId);return f||list[0]};
  const due=pool().filter(c=>{const s=st(c);return s&&s.due<=now});
  if(due.length>1||(due.length===1&&due[0].id!==lastId))return pick(due);
  if(S.newDone[S.set.dir]<S.set.newPerDay){
    const ds=S.set.decks;
    for(let i=0;i<ds.length;i++){const dk=ds[(S.newDone[S.set.dir]+i)%ds.length];const n=pool().find(c=>c.deck===dk&&!st(c)&&c.id!==lastId);if(n)return n}
  }
  if(due.length)return due[0];
  const ahead=pool().filter(c=>{const s=st(c);return s&&s.learning&&s.due<=now+20*MIN});
  if(ahead.length)return pick(ahead);
  return null;
}

/* ---------- native Android app bridge (used only inside the installed Android app) ---------- */
const NAT=window.NativeApp||null;
let _nid=0;const _ntts={},_nsr={};
window.__nativeTtsDone=id=>{const f=_ntts[id];if(f){delete _ntts[id];f()}};
window.__nativeSr=(id,kind,data)=>{const h=_nsr[id];if(h)h[kind](data)};
function speakNative(text,lang){return new Promise(res=>{const id='t'+(++_nid);_ntts[id]=res;
  NAT.speak(text,lang,lang.startsWith('en')?1:+S.set.rate,id,(S.set.voice||{})[lang.slice(0,2).toLowerCase()]||'');setTimeout(()=>window.__nativeTtsDone(id),4000+text.length*300)})}
function listenNative(lang,ms,onHeard){return new Promise(res=>{
  const id='r'+(++_nid);let interim='',done=false,t;
  const fin=v=>{if(done)return;done=true;clearTimeout(t);delete _nsr[id];curRec=null;res(v)};
  _nsr[id]={partial:x=>{if(x){interim=x;onHeard&&onHeard(x)}},result:a=>fin(a&&a.length?a:interim?[interim]:[]),
    error:c=>{if(c==='not-allowed'){micBlocked=true;showMicNote();fin(null)}else fin(interim?[interim]:[])}};
  curRec={abort(){try{NAT.abortListening()}catch(e){}fin(interim?[interim]:[])}};
  t=setTimeout(()=>{try{NAT.stopListening()}catch(e){}t=setTimeout(()=>fin(interim?[interim]:[]),2000)},ms);
  NAT.listen(lang,id)})}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}

function pickVoice(lang){const want=(S.set.voice||{})[lang.slice(0,2).toLowerCase()];if(want){const w=voices.find(v=>v.name===want);if(w)return w}
  const L=lang.toLowerCase();const n=v=>v.lang.replace('_','-').toLowerCase();
  return voices.find(v=>n(v)===L&&/google|siri|enhanced|premium|natural/i.test(v.name))||voices.find(v=>n(v)===L)||voices.find(v=>n(v).startsWith(L.slice(0,2)))}
function speak(text,lang){return NAT?speakNative(text,lang):speakWeb(text,lang)}
function speakWeb(text,lang){return new Promise(res=>{
  if(!('speechSynthesis' in window))return res();
  const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;
  u.rate=lang.startsWith('es')?+S.set.rate:1;
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(t);res()};
  u.onend=fin;u.onerror=fin;const t=setTimeout(fin,3000+text.length*120);
  if(speechSynthesis.speaking)speechSynthesis.cancel();
  speechSynthesis.speak(u);
})}
const sayable=s=>s.replace(/\(.*?\)/g,'').replace(/…/g,'').split(';').map(x=>x.trim()).filter(Boolean);
const enSay=c=>sayable(c.en).join(', or ');
const esSay=c=>c.es.replace(/…/g,'');
const promptOf=c=>S.set.dir==='je'?[esSay(c),'es-ES']:[enSay(c),'en-GB'];
const answerOf=c=>S.set.dir==='je'?[enSay(c),'en-GB']:[esSay(c),'es-ES'];

let actx;
function tone(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  (ok?[660,880]:[300,220]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='sine';
    g.gain.setValueAtTime(0,t+i*.13);g.gain.linearRampToValueAtTime(.18,t+i*.13+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.13+.22);
    o.connect(g).connect(actx.destination);o.start(t+i*.13);o.stop(t+i*.13+.25)})}catch(e){}}

/* ---------- speech in ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBlocked=NAT?!NAT.srAvailable():!SR,curRec=null;
function listen(lang,ms,onHeard){return NAT?listenNative(lang,ms,onHeard):listenWeb(lang,ms,onHeard)}
function listenWeb(lang,ms,onHeard){return new Promise(res=>{
  let rec,t,finished=false,alts=[],interim='';
  const finish=v=>{if(finished)return;finished=true;clearTimeout(t);curRec=null;try{rec&&rec.abort()}catch(e){}res(v)};
  try{rec=new SR()}catch(e){return finish(null)}
  curRec=rec;rec.lang=lang;rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){for(let j=0;j<r.length;j++)alts.push(r[j].transcript)}else interim=r[0].transcript}onHeard&&onHeard(alts[0]||interim)};
  rec.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){micBlocked=true;showMicNote();finish(null)}};
  rec.onend=()=>finish(alts.length?alts:interim?[interim]:[]);
  t=setTimeout(()=>{try{rec.stop()}catch(e){}t=setTimeout(()=>finish(alts.length?alts:interim?[interim]:[]),900)},ms);
  try{rec.start()}catch(e){finish(null)}
})}

/* ---------- answer checking ---------- */
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
const overlap=(h,t)=>{const tw=t.split(' ');if(tw.length<3)return 0;const hw=new Set(h.split(' '));return tw.filter(w=>hw.has(w)).length/tw.length};
const NUM={one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'};
function normEn(s){s=s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/…/g,' ').replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/^(to|the|a|an|my|it's|its|it is)\s+/,'');return s.split(' ').map(w=>NUM[w]||w).join(' ')}
const ESNUM={uno:'1',un:'1',una:'1',dos:'2',tres:'3',cuatro:'4',cinco:'5',seis:'6',siete:'7',ocho:'8',nueve:'9',diez:'10'};
// Spanish: ignore accents, ¿¡ punctuation and a leading article, so "perro" counts for "el perro"
function normEs(s){s=s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/…/g,' ').replace(/[^a-z0-9ñ ]+/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/^(el|la|los|las|un|una|unos|unas)\s+/,'');return s.split(' ').map(w=>ESNUM[w]||w).join(' ')}
const enTargets=c=>[...c.en.split(';'),c.en,...c.enA].map(normEn).filter(Boolean);
const esTargets=c=>[c.es,...c.esA,...c.enA.filter(x=>/^\d+$/.test(x))].map(normEs).filter(Boolean);
function judge(c,heard){
  if(!heard||!heard.length)return false;
  if(S.set.dir==='je'){const T=enTargets(c);return heard.some(h=>{h=normEn(h);return T.some(t=>h===t||(' '+h+' ').includes(' '+t+' ')||sim(h,t)>=.8||overlap(h,t)>=.75)})}
  const T=esTargets(c);
  return heard.some(h=>{h=normEs(h);return T.some(t=>h===t||(t.length>3&&(' '+h+' ').includes(' '+t+' '))||(t.length>6&&sim(h,t)>=(t.length>12?.75:.8))||overlap(h,t)>=.8)});
}
function casualHit(c,heard){
  if(!c.casual.size)return false;
  const n=S.set.dir==='je'?normEn:normEs;const cas=[...c.casual].map(n);
  const main=S.set.dir==='je'?c.en.split(';').map(normEn):[normEs(c.es)];
  return heard.some(h=>cas.includes(n(h)))&&!heard.some(h=>main.includes(n(h)));
}

  const body=[`Card: ${cur.es}`,`English: ${cur.en}`,`Level: ${LEVELS[cur.deck]}`,`Mode: ${dir}`,lastHeard?`App heard: ${lastHeard}`:'',`Type: ${KINDS[fixKind]}`,'',`Suggestion: ${fixText||'(none)'}`].filter((x,i)=>x||i===6).join('\n');
  return REPO+'?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body)+'&labels=spanish';
}
function fixHtml(){

  return `<div class="fix"><div class="fix-kinds" role="group" aria-label="What's the problem">${Object.entries(KINDS).map(([k,v])=>`<button data-kind="${k}" aria-pressed="${fixKind===k}">${v}</button>`).join('')}</div>

// other answers: only in the language you answer in
function altsHtml(){

  if(!xs.length)return '';

  const chips=xs.map(x=>{const c=cur.casual.has(x);const t=es?x:x.replace(/\bi\b/g,'I');return `<span class="chip${es?' esc':''}${c?' casual':''}">${escH(t)}${c?'<small>casual</small>':''}</span>`}).join('');
  return `<button class="alts-btn" id="altsBtn" aria-expanded="true">Hide other answers</button><div class="alts"><div class="grp">${chips}</div></div>`;
}
// show the article in a lighter weight: "el perro"

  if(revealed){
    html+=`<div class="answer">${cur.pic?`<div class="pic" aria-hidden="true">${cur.pic}</div>`:''}${S.set.dir==='je'?`<div class="en">${escH(cur.en)}</div>`:`<div class="es${long?' long':''}">${esHtml(cur.es)}</div>`}${altsHtml()}</div>`;

  if(revealed){const now=Date.now(),s=st(cur);

    $('grades').innerHTML=['Again','Hard','Good','Easy'].map((n,i)=>`<button data-g="${i}">${n}<small>${fmt(schedule(s,i,now).due-now)}</small></button>`).join('')}

function resetCard(){revealed=false;feedback=null;suggest=null;showAlts=false;showFix=false;fixText='';lastHeard=''}
function show(){cur=nextCard();resetCard();render();
  const pr=cur&&promptOf(cur);if(pr&&+S.set.auto&&!walking&&userActed)speak(pr[0],pr[1])}

/* ---------- walk mode ---------- */
let walking=false,wake=null,graceRes=null;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function status(t){$('wStatus').textContent=t;const p=$('pocketStatus');if(p)p.textContent=t}
// pocket mode: black screen that ignores touches; hold 2 s to exit
function pocketOn(){try{NAT&&NAT.immersive(true)}catch(e){}$('pocket').hidden=false;try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
function pocketOff(){try{NAT&&NAT.immersive(false)}catch(e){}$('pocket').hidden=true;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
{let ht;const pk=()=>$('pocket');
 document.addEventListener('pointerdown',e=>{if(pk().hidden||!pk().contains(e.target))return;e.preventDefault();clearTimeout(ht);ht=setTimeout(pocketOff,2000)},true);
 ['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>clearTimeout(ht),true));
 document.addEventListener('click',e=>{if(!pk().hidden&&pk().contains(e.target)){e.preventDefault();e.stopPropagation()}},true)}
function parseCmd(t){t=t.toLowerCase();
  if(/repeat|again|one more|say it|pardon|repite|otra vez/.test(t))return 'repeat';
  if(/wrong|missed|incorrect|didn.?t know|mal/.test(t))return 'wrong';
  if(/right|correct|got it|yes|bien/.test(t))return 'right';
  if(/next|skip|carry on|continue|go on|siguiente/.test(t))return 'next';
  return null}
function commandWindow(flipLabel,ms){return new Promise(res=>{
  const box=$('grace');box.hidden=false;
  box.innerHTML=`<button class="btn" data-c="repeat">↻ Repeat</button><button class="btn" data-c="flip">${flipLabel}</button><button class="btn primary" data-c="next">Next →</button>`;
  let done=false,t;const fin=v=>{if(done)return;done=true;clearTimeout(t);box.hidden=true;graceRes=null;try{curRec&&curRec.abort()}catch(e){}res(v)};
  graceRes=fin;box.onclick=e=>{const b=e.target.closest('[data-c]');if(b)fin(b.dataset.c)};
  t=setTimeout(()=>fin(null),ms);
  if(!micBlocked)listen('en-GB',ms-300).then(h=>{if(h&&h.length){const c=parseCmd(h.join(' '));if(c)fin(c)}});
})}
async function replay(){const pr=promptOf(cur),an=answerOf(cur);await speak(pr[0],pr[1]);await wait(700);if(walking)await speak(an[0],an[1])}
async function afterAnswer(ok){
  for(let i=0;i<6&&walking;i++){
    status((ok?'Marked right':'Marked wrong')+' — say “repeat”, “'+(ok?'wrong':'right')+'” or “next”');
    const c=await commandWindow(ok?'✗ I got it wrong':'✓ I was right',micBlocked?3500:4500);
    if(!walking)return ok;
    if(c==='repeat'){status('Repeating…');await replay();continue}
    if(c==='flip')ok=!ok;else if(c==='wrong')ok=false;else if(c==='right')ok=true;
    return ok;
  }
  return ok;
}
async function sayItBack(al){
  const [rt,rl]=answerOf(cur);
  for(let i=0;i<3&&walking;i++){
    status('Now say it back'+(i?' — try again':''));await wait(250);
    const h=await listen(al,S.set.gap*1000,x=>{if(x){feedback={cls:'info',text:'Heard: '+x};render()}});
    if(!walking||h===null)return;
    if(judge(cur,h)){tone(true);feedback={cls:'ok',text:'Nice — you said it right'};render();status('Nice — you said it right');await wait(700);return}
    tone(false);feedback={cls:'no',text:h.length?'Heard “'+h[0]+'” — listen again':'Didn’t catch that — listen again'};render();
    if(i<2){await wait(300);await speak(rt,rl)}
  }
  status('Moving on — this one will come back soon');await wait(600);
}
async function walkLoop(){
  while(walking){
    cur=nextCard();resetCard();render();
    if(!cur){status('All done for now');await speak('All done for now. Great work.','en-GB');stopWalk();break}
    const pr=promptOf(cur);const [,al]=answerOf(cur);
    status('Listen…');await speak(pr[0],pr[1]);if(!walking)break;
    let ok=true;
    if(S.set.walkMode==='listen'||micBlocked){
      for(let s=S.set.gap;s>0&&walking;s--){status('Think of the answer… '+s);await wait(1000)}
      if(!walking)break;
      status('Answer');await doReveal();if(!walking)break;
    }else{
      status('Your turn — say it '+(al.startsWith('es')?'in Spanish':'in English'));
      const heard=await listen(al,S.set.gap*1000,h=>{if(h){feedback={cls:'info',text:'Heard: '+h};render()}});
      if(!walking)break;
      ok=heard!==null&&judge(cur,heard);tone(ok);heardFeedback(ok,heard);
      status(ok?'Correct':'Here’s the answer');await doReveal();if(!walking)break;
      if(!ok){await wait(500);const [rt,rl]=answerOf(cur);await speak(rt,rl);if(!walking)break;await sayItBack(al);if(!walking)break}
    }
    ok=await afterAnswer(ok);if(!walking)break;
    grade(cur,ok?2:0);lastId=cur.id;await wait(400);
  }
}
function walkHelp(on){const L=S.set.walkMode==='listen'||micBlocked;
  const steps=L?['You hear the prompt.','Think of the answer during the pause.','You hear the translation.','Say <b>“repeat”</b> to hear it again, <b>“wrong”</b> if you missed it, or <b>“next”</b>. Say nothing and it counts as right.']
    :['You hear the prompt.','Say the answer out loud.','If you get it wrong, it says the correct answer and waits for you to <b>say it back</b> (up to 3 tries).','Then say <b>“repeat”</b>, <b>“wrong”</b>, <b>“right”</b> or <b>“next”</b>. Say nothing and it moves on.'];
  return `<ol>${steps.map(x=>`<li>${x}</li>`).join('')}</ol><p>Keep this screen on and the app open.${micBlocked&&!L?' Speaking back isn’t available here, so this works like Listen only.':''}</p>`}
function setWalkMode(m){S.set.walkMode=m;save();$('wmSpeak').setAttribute('aria-pressed',m==='speak');$('wmListen').setAttribute('aria-pressed',m==='listen');$('wHelp').innerHTML=walkHelp(false)}
$('wmSpeak').onclick=()=>setWalkMode('speak');$('wmListen').onclick=()=>setWalkMode('listen');
async function startWalk(){
  walking=true;userActed=true;try{NAT&&NAT.keepAwake(true)}catch(e){}
  $('walkBtn').lastChild.textContent='Stop walk mode';$('walkBtn').classList.remove('primary');
  $('walkModes').hidden=true;$('pocketBtn').hidden=false;$('wHelp').innerHTML=walkHelp(true);
  try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  walkLoop();
}
function stopWalk(){
  walking=false;try{NAT?(NAT.stopSpeaking(),NAT.keepAwake(false)):speechSynthesis.cancel()}catch(e){}try{curRec&&curRec.abort()}catch(e){}graceRes&&graceRes(null);
  try{wake&&wake.release()}catch(e){}wake=null;
  $('walkBtn').lastChild.textContent='Start walk mode';$('walkBtn').classList.add('primary');status('Walk mode');
  $('walkModes').hidden=false;$('pocketBtn').hidden=true;pocketOff();$('wHelp').innerHTML=walkHelp(false);
  resetCard();cur=nextCard();render();
}
$('walkBtn').onclick=()=>walking?stopWalk():startWalk();
$('pocketBtn').onclick=pocketOn;
// if the phone locks, the browser pauses the page: stop cleanly and say why
document.addEventListener('visibilitychange',()=>{if(walking&&document.visibilityState==='hidden'){stopWalk();status('Walk mode stopped because the screen locked — use pocket mode instead')}});
document.addEventListener('visibilitychange',async()=>{if(walking&&document.visibilityState==='visible'&&!wake){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});

function showMicNote(){const n=$('micNote');n.hidden=false;
  n.innerHTML=SR?'<strong>Speaking back is blocked in this view.</strong> Open the app from its own link in Chrome or Safari to answer by voice.':
  '<strong>This browser can’t listen.</strong> Use Chrome (Android, desktop) or Safari (iPhone) to answer by voice. You can still study by tapping.';render()}
if(micBlocked)showMicNote();
setWalkMode(S.set.walkMode);
show();

/* ---------- voice picker ---------- */
const TL='es',TTAG='es-ES',TSAMPLE='Hola, ¿qué tal? Vamos a practicar español juntos.',ESAMPLE='Hello! Let’s practise together.';
function voiceList(pre){
  if(NAT){try{return JSON.parse(NAT.voices(pre))}catch(e){return[]}}
  const L=v=>v.lang.replace('_','-').toLowerCase();
  return voices.filter(v=>L(v).startsWith(pre)).sort((a,b)=>(b.localService===false)-(a.localService===false)||a.name.localeCompare(b.name))
    .map(v=>({name:v.name,label:v.name.replace(/^(Microsoft|Google)\s+/,'')+' ('+v.lang+')'+(v.localService===false?' · online':'')}))}
function fillVoices(){
  S.set.voice=S.set.voice||{};
  for(const [id,pre] of [['sVoiceT',TL],['sVoiceE','en']]){
    const el=$(id),list=voiceList(pre),cur=S.set.voice[pre]||'';
    el.innerHTML='<option value="">Automatic</option>'+list.map(v=>`<option value="${escH(v.name).replace(/"/g,'&quot;')}">${escH(v.label)}</option>`).join('');
    el.value=list.some(v=>v.name===cur)?cur:'';
    el.onchange=()=>{S.set.voice[pre]=el.value;save();speak(pre==='en'?ESAMPLE:TSAMPLE,pre==='en'?'en-GB':TTAG)};
  }
  const n=voiceList(TL).length;
  $('vNote').innerHTML=(n?'':'No Spanish voices found on this phone. ')+'Voices sound robotic? Install <b>Speech Services by Google</b>, then in phone Settings → General management → Language and input → Text-to-speech output, choose it and download the Spanish and English voices.';
}
document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{userActed=true;const t=b.dataset.test==='t';speak(t?TSAMPLE:ESAMPLE,t?TTAG:'en-GB')});
window.__nativeTtsReady=()=>{try{fillVoices()}catch(e){}};
if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',()=>{try{fillVoices()}catch(e){}});
fillVoices();
</script>
